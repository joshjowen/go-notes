# go-notes behind Caddy, with Authelia as the identity provider.
#
#   podman compose -f deploy/docker-compose.yml up --build
#   docker compose  -f deploy/docker-compose.yml up --build
#
# Before the first run:
#   1. cp deploy/.env.example deploy/.env    and fill in the secrets
#   2. edit deploy/caddy/Caddyfile           and deploy/authelia/configuration.yml
#      to use your own domain names
#   3. generate the OIDC signing key and the client secret pair — see the README
#
# For a simpler setup with no identity provider, use docker-compose.local-auth.yml.

name: go-notes

services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    # The only service that publishes ports. Everything else is reachable solely
    # on the internal network.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - go-notes
      - authelia
    networks: [go-notes]

  authelia:
    image: docker.io/authelia/authelia:4
    restart: unless-stopped
    volumes:
      - ./authelia:/config:z
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      # Deliberately not `embeddings`. The first start of that container
      # downloads a few hundred megabytes of weights, and nothing about notes,
      # search or the graph depends on it — go-notes should be usable while it
      # is still unpacking, and stay usable if it never comes up at all.
    networks: [go-notes]

  go-notes:
    build:
      context: ..
      dockerfile: Dockerfile
    image: go-notes:latest
    restart: unless-stopped
    environment:
      GO_NOTES__SERVER__PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      DATABASE_URL: postgres://go_notes:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/go_notes

      # Authelia is the primary way in.
      GO_NOTES__AUTH__OIDC__ENABLED: "true"
      GO_NOTES__AUTH__OIDC__ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL in .env}
      GO_NOTES__AUTH__OIDC__CLIENT_ID: go-notes
      GO_NOTES__AUTH__OIDC__CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}

      # Re-check group membership in go-notes itself, not just in Authelia's
      # access-control rule. Defence in depth: a misconfigured Authelia client
      # policy that admitted everyone would still be caught here. Must match the
      # group named in deploy/authelia/configuration.yml.
      GO_NOTES__AUTH__OIDC__REQUIRED_GROUP: ${OIDC_REQUIRED_GROUP:-notes}

      # Password login is OFF by default on this internet-facing stack, and that
      # is deliberate. There is no forward-auth here, so /api/auth/login is a
      # native go-notes endpoint reachable straight from the internet — it does
      # NOT get Authelia's brute-force regulation or its second factor, only
      # go-notes' own in-memory throttle. Left on, it is a permanently-open,
      # single-factor password door beside the hardened OIDC one.
      #
      # Keep it off unless you specifically need a break-glass account for when
      # Authelia is down — and if you do turn it on (LOCAL_AUTH_ENABLED=true in
      # .env), restrict /api/auth/login to your LAN/VPN in the Caddyfile. See the
      # commented matcher in deploy/caddy/Caddyfile.
      GO_NOTES__AUTH__LOCAL__ENABLED: ${LOCAL_AUTH_ENABLED:-false}

      # Suggested links: notes that are *about* the same thing without linking
      # to each other, drawn as dashed edges in the graph. Served by the
      # `embeddings` container below, so nothing leaves this host — point
      # API_BASE at a hosted provider instead and the text of your notes is
      # sent to it, which is a different decision and worth making on purpose.
      #
      # Set EMBEDDINGS_ENABLED=false in .env to turn the feature off; the
      # container can then be stopped, and everything else works exactly as it
      # did before.
      GO_NOTES__EMBEDDINGS__ENABLED: ${EMBEDDINGS_ENABLED:-true}
      GO_NOTES__EMBEDDINGS__API_BASE: ${EMBEDDINGS_API_BASE:-http://embeddings:80/v1}
      GO_NOTES__EMBEDDINGS__API_KEY: ${EMBEDDINGS_API_KEY:-}
      GO_NOTES__EMBEDDINGS__MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}
      # How alike two passages must be before the graph suggests a connection.
      # Worth tuning to your own notes — see the README; BGE's scores sit high,
      # so too low a value connects everything to everything.
      GO_NOTES__EMBEDDINGS__MIN_SCORE: ${EMBEDDINGS_MIN_SCORE:-0.70}

      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # A bind mount rather than a named volume, on purpose: the whole point of
      # storing notes as markdown is that you can read them without this app.
      # `:z` relabels for SELinux, which Fedora and RHEL require.
      - ${NOTES_DIR:-./data/notes}:/data/notes:z
      - ./config:/config:z
    # Rootless Podman maps your host account to *root* inside the container, so
    # the container's own uid 1000 lands on an unprivileged subuid that cannot
    # write to a bind mount you own — `go-notes user add` fails with "Permission
    # denied" and no vault is ever created. `keep-id` maps container uid 1000
    # back to yours, so the markdown files come out owned by you.
    #
    # Docker neither understands nor needs this: its daemon runs as root and
    # bind mounts are not remapped. For Docker, put `USERNS_MODE=` (empty) in
    # deploy/.env, or delete this line.
    userns_mode: ${USERNS_MODE:-keep-id:uid=1000,gid=1000}
    healthcheck:
      # Declared here as well as in the Dockerfile: podman's default OCI image
      # format discards the image's own HEALTHCHECK instruction.
      test: ["CMD", "/usr/local/bin/go-notes", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [go-notes]

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: go_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: go_notes
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Authelia keeps its own state in the same server, in a separate database.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_notes"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [go-notes]

  # The embeddings model behind "suggested links", served over the same
  # OpenAI-compatible API go-notes speaks to a hosted provider.
  #
  # BGE-small-en-v1.5 is a 384-dimension English embedding model chosen for CPU
  # deployments on modest hardware — a NUC-class machine, not a workstation.
  # Measured on a 4-core budget against BGE-base-en-v1.5: roughly a third of the
  # latency (a batch of 32 note-length passages: ~0.85s vs ~2.1s), less than
  # half the resident memory (~340MB vs ~880MB idle), and half the vector width,
  # which is half the storage and half the arithmetic in the brute-force
  # note-to-note comparison in similarity.rs. Retrieval quality costs about 1.4
  # points of MTEB average against base, which does not show up in a personal
  # vault's worth of notes. Swap `--model-id` for `BAAI/bge-base-en-v1.5` if
  # this host has CPU and RAM to spare and you want the difference back, or
  # `BAAI/bge-m3` if your notes are not in English.
  #
  # A meaningfully stronger option exists for hosts with RAM to spare —
  # Qwen/Qwen3-Embedding-0.6B told two lexically-similar but semantically
  # unrelated notes apart where bge-small confused them. It costs roughly 8x
  # the idle memory (~2.5GB) and needs `--max-batch-tokens` capped below its
  # default or it can OOM the host outright during warmup. See the README's
  # "A stronger model, if you have the hardware" section before switching —
  # `EMBEDDINGS_MODEL` alone is not enough, `min_score` and `batch_size` both
  # need retuning too.
  #
  # This publishes no ports: it is reachable only from go-notes on the internal
  # network, so the text of your notes never leaves the host.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    restart: unless-stopped
    # `${EMBEDDINGS_MODEL}` on purpose, the same variable go-notes itself reads
    # below — one place to change, not two that can silently disagree about
    # which model is actually running.
    command: ["--model-id", "${EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}", "--auto-truncate"]
    environment:
      # Where the weights are cached. The first start downloads roughly 130 MB
      # from huggingface.co and then never needs the internet again; the volume
      # below is what makes that true across restarts. On a machine with no
      # route out, seed this volume from one that has.
      HF_HOME: /data
    volumes:
      - embeddings:/data
    # No healthcheck on purpose. Nothing depends on this container — go-notes
    # neither waits for it nor needs it — and the image carries no shell and no
    # curl, so any check would be a guess at an internal binary name that shows
    # the container as permanently unhealthy when the guess is wrong. Whether it
    # is working is visible where it matters: `podman logs go-notes-embeddings`,
    # and suggested links appearing in the graph.
    networks: [go-notes]

volumes:
  pgdata:
  embeddings:
  caddy_data:
  caddy_config:

networks:
  go-notes:
    driver: bridge
