<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` puts the page under the notch and the home
      indicator; the layout pads itself back out with env(safe-area-inset-*).
      `maximum-scale` is deliberately *not* set: pinch-zoom is an accessibility
      feature, and the fix for a form that zooms on focus is a 16px font, which
      the stylesheet does.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Go-Notes</title>

    <!--
      Installed as an app: the manifest describes the icons and the standalone
      window, and the Apple-prefixed tags are what iOS reads instead, since
      Safari still ignores most of the manifest for Add to Home Screen.

      The theme colour is what tints the status bar and the window chrome. Two
      of them, so a phone in light mode does not get a dark bar over a light
      page.
    -->
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Go-Notes" />
    <!--
      `black-translucent` is what lets the page run under the status bar on iOS,
      which is the point of viewport-fit=cover above.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      The editor bundle is a classic script, loaded before the WebAssembly
      module so `window.GoNotesEditor` is defined by the time Rust reaches for
      it. Both files are produced by `npm run build` in editor/ and are copied
      into the Trunk output as-is; nothing is fetched from a remote origin,
      because the server's Content-Security-Policy forbids it.
    -->
    <link data-trunk rel="copy-file" href="assets/editor-bridge.js" />
    <link data-trunk rel="copy-file" href="assets/editor-bridge.css" />
    <link rel="stylesheet" href="/editor-bridge.css" />
    <script src="/editor-bridge.js"></script>

    <!--
      The service worker that caches the application shell, so reloading with
      no connection starts the app rather than the browser's error page. Copied
      to the bundle root because a worker's scope cannot be broader than the
      path it is served from, and this one has to cover every route.
      Registration happens from Rust, in offline::register_service_worker.
    -->
    <link data-trunk rel="copy-file" href="sw.js" />

    <link data-trunk rel="css" href="styles.css" />
    <!--
      The feature flags are not optional. Recent rustc emits post-MVP
      WebAssembly instructions — bulk memory, saturating float casts, sign
      extension — that wasm-opt refuses to validate unless each is explicitly
      enabled, and the build fails outright rather than degrading. Every one of
      these has been supported by browsers since 2021.
    -->
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types"
    />
  </head>

  <body>
    <noscript>
      Go-Notes is a WebAssembly application and needs JavaScript enabled. Your
      notes are plain markdown files on the server, so they remain readable
      without it.
    </noscript>
  </body>
</html>
