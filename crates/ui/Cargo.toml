[package]
name = "go-notes-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Leptos frontend for Go-Notes, built to wasm32 by Trunk"

[dependencies]
go-notes-shared = { workspace = true }

leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8", features = ["nightly"] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DomRect",
    "DomRectReadOnly",
    "ResizeObserver",
    "ResizeObserverEntry",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "DragEvent",
    "DataTransfer",
    "File",
    "FileList",
    "FormData",
    "Storage",
    "MediaQueryList",
    "Location",
    "Performance",
    # Offline mode: IndexedDB for the local vault, the service worker for the
    # application shell, and the events that say whether there is a network.
    "console",
    "DomException",
    "DomStringList",
    "Event",
    "EventTarget",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Navigator",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
]
